name: Draft

on:
  push:
    branches: [main]
    paths:
      - "draft-traviss-evil-byte-00.md"
      - "draft-traviss-evil-byte-00.xml"
      - "draft-traviss-evil-byte-00.pdf"
      - "scripts/build-rfcxml.mjs"
      - "scripts/check-nits.mjs"
      - "package.json" # pins the idnits version
      - "package-lock.json"
      - "scripts/compare-pdf-text.py"
      - ".github/workflows/draft-ci.yml"
  pull_request:
    paths:
      - "draft-traviss-evil-byte-00.md"
      - "draft-traviss-evil-byte-00.xml"
      - "draft-traviss-evil-byte-00.pdf"
      - "scripts/build-rfcxml.mjs"
      - "scripts/check-nits.mjs"
      - "package.json" # pins the idnits version
      - "package-lock.json"
      - "scripts/compare-pdf-text.py"
      - ".github/workflows/draft-ci.yml"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"

      - run: npm ci
      - run: pip install xml2rfc

      - name: Regenerate RFCXML from the Markdown source
        run: npm run build:rfcxml

      - name: Fail if the checked-in XML is stale
        run: git diff --exit-code draft-traviss-evil-byte-00.xml

      # xml2rfc exits non-zero on structural errors (invalid anchors,
      # dangling xrefs, malformed XML). Warnings (line width, etc.) pass.
      - name: Validate against the real IETF toolchain
        run: |
          xml2rfc draft-traviss-evil-byte-00.xml --text -o /tmp/draft.txt
          xml2rfc draft-traviss-evil-byte-00.xml --html -o /tmp/draft.html

      # idnits is what the Datatracker runs on a submission, and nothing here
      # was running it -- which is how an [RFC3514] citation reached the
      # abstract. scripts/check-nits.mjs decides what gates: "normal" mode
      # rather than "submission" mode, because submission mode is narrow
      # enough to miss a missing Security Considerations section, minus one
      # documented idnits limitation. Warnings and comments are printed only.
      - name: Check nits
        run: npm run check:nits

      # The PDF writer is a separate code path with dependencies too heavy
      # for a runner -- Pango, WeasyPrint, and 1.4 GB of Noto fonts -- so
      # use the IETF's own image, which carries them. The command is the
      # one author-tools runs.
      - name: Render the PDF
        run: |
          docker run --rm -w /data \
            -v "$PWD:/data:ro" -v "$RUNNER_TEMP:/out" \
            ghcr.io/ietf-tools/xml2rfc-base:latest \
            xml2rfc --pdf --out /out/rendered.pdf draft-traviss-evil-byte-00.xml

      # Not `git diff --exit-code` as above: the PDF is not
      # byte-reproducible, since its XMP metadata carries a timestamp and
      # its line breaking moves with the xml2rfc version. Compare the words.
      - name: Fail if the checked-in PDF is stale
        run: |
          pip install pypdf
          python scripts/compare-pdf-text.py \
            draft-traviss-evil-byte-00.pdf "$RUNNER_TEMP/rendered.pdf"

      - name: Keep the render that disagreed
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: rendered-pdf
          path: ${{ runner.temp }}/rendered.pdf
