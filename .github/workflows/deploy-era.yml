name: Deploy ERA

on:
  push:
    branches: [main]
    paths: ["era/**", ".github/workflows/deploy-era.yml"]
  schedule:
    # RIPE republishes asn.txt daily; keep era.evilbyte.net's ratings from
    # going too stale even when nothing in era/ itself has changed.
    - cron: "17 4 * * *"
  workflow_dispatch: {}

concurrency:
  group: deploy-era
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install dependencies
        working-directory: era
        run: npm ci

      - name: Rebuild the ASN database from RIPE
        working-directory: era
        run: npm run build:db

      - name: Deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: era
          command: deploy
