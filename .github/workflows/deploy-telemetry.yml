name: Deploy Telemetry

on:
  push:
    branches: [main]
    paths:
      - "telemetry/**"
      - "site/public/evil-formula.mjs" # shared import — redeploy telemetry if the formula changes
      - ".github/workflows/deploy-telemetry.yml"
  workflow_dispatch: {}

concurrency:
  group: deploy-telemetry
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install dependencies
        working-directory: telemetry
        run: npm ci

      - name: Apply D1 migrations
        working-directory: telemetry
        run: npx wrangler d1 migrations apply evil-byte-telemetry --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: telemetry
          command: deploy

      # Runtime secrets for the deployed Worker's scheduled()/fetch() handlers —
      # a separate mechanism from the two secrets above, which only authenticate
      # this job's own `wrangler`/`wrangler-action` calls. Idempotent: re-setting
      # the same value is a harmless no-op, so this runs on every deploy.
      - name: Set LOGS_API_TOKEN runtime secret
        working-directory: telemetry
        run: echo "${{ secrets.CLOUDFLARE_LOGS_API_TOKEN }}" | npx wrangler secret put LOGS_API_TOKEN
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Set CF_ACCOUNT_ID runtime secret
        working-directory: telemetry
        run: echo "${{ secrets.CLOUDFLARE_ACCOUNT_ID }}" | npx wrangler secret put CF_ACCOUNT_ID
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
